[package]
name = "sevnx-monitor"
version = "1.0.0"
description = "SevnX Monitor Windows desktop application"
authors = ["SevnX Monitor Contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "sevnx_monitor_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Tauri uses this feature to select the packaged frontend rather than devUrl.
# `cargo tauri dev` disables default features; release builds retain it.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
regex = "1"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "=2.11.3", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Packaging_Appx",
] }
zeroize = "1"
