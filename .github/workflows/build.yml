name: build

# Compilation is authoritative here. Local machines only keep sources and docs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One build per ref. Pushing twice in a row cancels the stale run instead of
# paying for both, which keeps the shared caches pointing at the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the installer as a release asset

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts bloat the cache and are useless on a fresh runner.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pins npm's cache to one directory so every npm invocation below (frontend
  # deps + global Tauri CLI) restores from the same cached tarballs.
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  windows-nsis:
    name: Windows NSIS bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Records the build start time and this commit's time in UTC+8 (second
      # precision) for the release title/notes. The offset is applied
      # arithmetically (epoch + 28800) instead of TZ=Asia/Shanghai: whether the
      # runner ships a tz database and whether `date` honours TZ is not something
      # this should depend on -- in Git Bash TZ=Asia/Shanghai silently falls back
      # to GMT, which would print a wrong "UTC+8" time. China has no DST, so a
      # fixed +8h offset is correct all year. Same approach as Zcode_harmony's CI.
      # Echoed to the log so the exact values can be checked from a run.
      - name: Record timestamps (UTC+8)
        shell: bash
        run: |
          cst() { # $1 = ISO timestamp (empty for now); $2 = date format
            local epoch
            if [ -n "$1" ]; then epoch=$(date -u -d "$1" +%s); else epoch=$(date -u +%s); fi
            date -u -d "@$((epoch + 28800))" "$2"
          }
          build_start=$(cst '' '+%Y-%m-%d %H:%M:%S')
          push_time=$(cst "$(git log -1 --pretty=%cI)" '+%Y-%m-%d %H:%M:%S')
          {
            echo "BUILD_START_UTC8=$build_start"
            echo "PUSH_TIME_UTC8=$push_time"
          } >> "$GITHUB_ENV"
          echo "build start $build_start (UTC+8) - commit $push_time (UTC+8)"

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Restores the whole src-tauri/target tree plus the cargo registry, so an
      # unchanged Cargo.lock skips recompiling ~400 dependency crates.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-nsis
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # NSIS + WiX binaries are downloaded once by the Tauri CLI and reused.
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: ${{ runner.os }}-tauri-bundler-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # `tauri build` runs tauri.conf.json's beforeBuildCommand, which performs
      # the vue-tsc type check and the Vite build. Running that here as well
      # would compile the frontend twice, so it is deliberately not duplicated.
      - name: Build NSIS installer
        run: tauri build --bundles nsis

      # GitHub always delivers workflow artifacts as a zip, so the installer is
      # published as a Release asset instead: release assets are stored as raw
      # files and download as the .exe itself.
      - name: Publish installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "no NSIS installer was produced" >&2
            exit 1
          fi

          # Timestamps come from the Record timestamps step (UTC+8, second
          # precision) via GITHUB_ENV; recomputed here as a fallback so a skipped
          # step cannot produce an empty value.
          cst_fallback() {
            local epoch
            if [ -n "$1" ]; then epoch=$(date -u -d "$1" +%s); else epoch=$(date -u +%s); fi
            date -u -d "@$((epoch + 28800))" '%Y-%m-%d %H:%M:%S'
          }
          build_start="${BUILD_START_UTC8:-$(cst_fallback '')}"
          push_time="${PUSH_TIME_UTC8:-$(cst_fallback "$(git log -1 --pretty=%cI)")}"

          # Notes always carry both UTC+8 timestamps: the commit time comes from
          # the commit itself (still meaningful on a re-run), the build start from
          # this job.
          notes="build start ${build_start} (UTC+8) - commit ${push_time} (UTC+8) - ${GITHUB_SHA:0:7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="SevnX Monitor $tag"
            # Our line first, GitHub's generated changelog appended after it.
            options=(--notes "$notes" --generate-notes)
            name="sevnx-monitor-${tag}-setup.exe"
            rolling=false
          else
            # Rolling build so main always exposes a direct .exe download link.
            # The tag deliberately has no `v` prefix: moving it below would
            # otherwise match this workflow's `v*` trigger and start a second run.
            tag="latest"
            title="Latest build (main, ${build_start} UTC+8)"
            options=(--prerelease --notes "$notes")
            name="sevnx-monitor-setup.exe"
            rolling=true
          fi

          # Release asset names must not contain spaces: GitHub rewrites them to
          # dots, which would make the download URL unpredictable. Tauri names
          # the installer after productName, hence the rename.
          staged="${RUNNER_TEMP}/${name}"
          cp "${installers[0]}" "$staged"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" --clobber
            if [ "$rolling" = true ]; then
              # Uploading only swaps the asset. Without moving the tag and
              # refreshing title/notes, the release page keeps advertising the
              # commit that first created it while serving a newer binary.
              git push --force origin "HEAD:refs/tags/$tag"
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            gh release create "$tag" --title "$title" "${options[@]}" "$staged"
          fi
