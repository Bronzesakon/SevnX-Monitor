name: build

# Compilation is authoritative here. Local machines only keep sources and docs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One build per ref. Pushing twice in a row cancels the stale run instead of
# paying for both, which keeps the shared caches pointing at the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the installer as a release asset

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts bloat the cache and are useless on a fresh runner.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pins npm's cache to one directory so every npm invocation below (frontend
  # deps + global Tauri CLI) restores from the same cached tarballs.
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  windows-nsis:
    name: Windows NSIS bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Restores the whole src-tauri/target tree plus the cargo registry, so an
      # unchanged Cargo.lock skips recompiling ~400 dependency crates.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-nsis
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # NSIS + WiX binaries are downloaded once by the Tauri CLI and reused.
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: ${{ runner.os }}-tauri-bundler-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # `tauri build` runs tauri.conf.json's beforeBuildCommand, which performs
      # the vue-tsc type check and the Vite build. Running that here as well
      # would compile the frontend twice, so it is deliberately not duplicated.
      - name: Build NSIS installer
        run: tauri build --bundles nsis

      # GitHub always delivers workflow artifacts as a zip, so the installer is
      # published as a Release asset instead: release assets are stored as raw
      # files and download as the .exe itself.
      - name: Publish installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "no NSIS installer was produced" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="SevnX Monitor $tag"
            notes=""
            options=(--generate-notes)
            name="sevnx-monitor-${tag}-setup.exe"
            rolling=false
          else
            # Rolling build so main always exposes a direct .exe download link.
            # The tag deliberately has no `v` prefix: moving it below would
            # otherwise match this workflow's `v*` trigger and start a second run.
            tag="latest"
            title="Latest build (main, $(date -u +%Y-%m-%d))"
            notes="Automatic build of main at ${GITHUB_SHA}"
            options=(--prerelease --notes "$notes")
            name="sevnx-monitor-setup.exe"
            rolling=true
          fi

          # Release asset names must not contain spaces: GitHub rewrites them to
          # dots, which would make the download URL unpredictable. Tauri names
          # the installer after productName, hence the rename.
          staged="${RUNNER_TEMP}/${name}"
          cp "${installers[0]}" "$staged"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" --clobber
            if [ "$rolling" = true ]; then
              # Uploading only swaps the asset. Without moving the tag and
              # refreshing title/notes, the release page keeps advertising the
              # commit that first created it while serving a newer binary.
              git push --force origin "HEAD:refs/tags/$tag"
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            gh release create "$tag" --title "$title" "${options[@]}" "$staged"
          fi
